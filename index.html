<title>Meu app</title>
<style>
:root{--bg:#F1EAE0;--card:#FBF7F1;--line:#DDD3C5;--line2:#CFC3B2;--ink:#2B2630;--mut:#655C69;--pur:#39213F;--vin:#762D42;--lar:#E97842}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,'Inter',system-ui,sans-serif;-webkit-text-size-adjust:100%}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
main{flex:1;padding:0 0 24px;display:flex;flex-direction:column}
.pad{padding:22px 20px;display:flex;flex-direction:column;gap:18px}
.hero{background:var(--pur);color:var(--bg);padding:26px 20px 20px;display:flex;flex-direction:column;gap:6px}
.hero .d{font-size:13px;color:#E6D9E8}
h1{margin:0;font-family:Georgia,'Fraunces',serif;font-size:30px;line-height:1.15;color:var(--pur)}
.hero h1{color:var(--bg)}
h2{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--vin)}
.sub{font-size:14px;color:var(--mut);line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
button{font-family:inherit;cursor:pointer;color:inherit}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-size:14px;font-weight:600}
.chip[aria-pressed=true]{background:var(--pur);color:var(--bg);border-color:var(--pur)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;border-bottom:1px solid #E8DFD1}
.row:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.name{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.small{font-size:13px;color:var(--mut)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
input[type=text],input[type=date],input[type=time],select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:12px 14px;min-height:48px}
textarea{line-height:1.5;resize:vertical;min-height:110px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--mut)}
.primary{min-height:52px;border-radius:16px;border:0;background:var(--pur);color:var(--bg);font-size:16px;font-weight:700;padding:0 18px}
.orange{min-height:48px;border-radius:14px;border:0;background:var(--lar);color:var(--pur);font-size:15px;font-weight:700;padding:0 16px}
.ghost{min-height:44px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-size:15px;font-weight:600;padding:0 14px}
.link{background:none;border:0;color:var(--vin);font-size:14px;font-weight:700;min-height:44px;padding:0 4px}
.back{align-self:flex-start;background:none;border:0;color:var(--vin);font-size:15px;font-weight:600;min-height:44px;padding:0}
nav{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--card);border-top:1px solid var(--line);padding:8px 6px calc(10px + env(safe-area-inset-bottom));position:sticky;bottom:0;z-index:5}
nav button{background:none;border:0;min-height:48px;font-size:12px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0}
nav button[aria-current=page]{color:var(--vin);font-weight:700}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav .plus{width:54px;height:54px;border-radius:50%;background:var(--lar);margin-top:-22px;border:4px solid var(--card);display:flex;align-items:center;justify-content:center;color:var(--pur)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--pur);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
.toast.on{opacity:1}
.note{background:#E4DACB;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5;color:#4A4150}
.warn{background:#F6E3D6;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;color:#4A2A1A}
.bar{height:10px;border-radius:5px;background:#E4DACB;overflow:hidden}.bar i{display:block;height:100%;background:var(--vin)}
.sheetbg{position:fixed;inset:0;background:rgba(42,24,48,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:14px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.grab{align-self:center;width:44px;height:5px;border-radius:3px;background:var(--line2)}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.types button{min-height:64px;border-radius:16px;background:var(--card);border:1px solid var(--line2);font-size:15px;font-weight:600;text-align:left;padding:0 14px}
.types button.soon{background:#E4DACB;border-style:dashed;color:#4A4150}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;text-align:center}
.cal .h{font-size:12px;font-weight:600;color:var(--mut)}
.cal button{min-height:48px;border:0;background:none;border-radius:12px;font-size:15px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.cal button.sel{background:var(--pur);color:var(--bg)}
.cal button.td:not(.sel){outline:2px solid var(--vin);outline-offset:-2px}
.cal .dots{display:flex;gap:3px;height:6px}.cal .dots i{width:6px;height:6px;border-radius:50%}
.sw{position:relative;display:inline-block;width:52px;height:32px;flex:none}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.sw .tr{position:absolute;inset:0;border-radius:16px;background:#B5A897}
.sw .th{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--card);transition:left .15s}
.sw input:checked~.tr{background:var(--pur)}.sw input:checked~.th{left:23px}
.msg{max-width:88%;padding:12px 14px;border-radius:18px;font-size:15px;line-height:1.5;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--pur);color:var(--bg);border-bottom-right-radius:4px}
.msg.ia{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.bar2{position:sticky;bottom:0}
:focus-visible{outline:3px solid var(--lar);outline-offset:2px}

@media (prefers-reduced-motion:no-preference){
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.anim #main.enter .hero,.anim #main.enter .pad>*{animation:up .42s cubic-bezier(.2,.7,.2,1) both}
.anim #main.enter .pad>*:nth-child(2){animation-delay:.05s}.anim #main.enter .pad>*:nth-child(3){animation-delay:.1s}.anim #main.enter .pad>*:nth-child(4){animation-delay:.15s}.anim #main.enter .pad>*:nth-child(5){animation-delay:.2s}.anim #main.enter .pad>*:nth-child(6){animation-delay:.25s}.anim #main.enter .pad>*:nth-child(n+7){animation-delay:.3s}
.anim button,.anim .row[role=button],.anim .chip{transition:transform .12s ease,background-color .2s ease,color .2s ease,border-color .2s ease}
.anim button:active,.anim .row[role=button]:active{transform:scale(.96)}
.anim .toast{transition:opacity .25s ease}
.anim .card{transition:box-shadow .2s ease}
}
</style>
</head>
<body>
<div class="app">
<main id="main"></main>
<nav aria-label="Navegação principal" id="nav">
<button data-nav="inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Início</button>
<button data-nav="agenda"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda</button>
<button data-a="criar" aria-label="Criar"><span class="plus"><svg viewBox="0 0 24 24" style="stroke-width:3"><path d="M12 5v14M5 12h14"/></svg></span></button>
<button data-nav="espacos"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>Espaços</button>
<button data-nav="iris"><svg viewBox="0 0 24 24"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></svg>Íris</button>
</nav>
</div>
<div class="toast" id="toast" role="status"></div>
<div id="sheetRoot"></div>
<script>
'use strict';
/* ====== dados ====== */
const LS='meu-app-v2';
const DEFAULT_AREAS=[{id:'estagio',n:'Estágio',c:'#39213F'},{id:'freelacom',n:'Freela comunicação',c:'#762D42'},{id:'freelas',n:'Freelas gerais',c:'#E97842'},{id:'pessoal',n:'Pessoal',c:'#8C6A9A'},{id:'casa',n:'Casa',c:'#6B7F5E'}];
const AREAS=[];
function syncAreas(){if(!Array.isArray(data.areas))data.areas=DEFAULT_AREAS.map(a=>Object.assign({},a));AREAS.length=0;data.areas.forEach(a=>AREAS.push(a))}
const MOODS=['Muito mal','Mal','Mais ou menos','Bem','Muito bem'];
const LV=['Baixa','Média','Alta'];
const TYPES={compromisso:'Compromisso',tarefa:'Tarefa',nota:'Anotação',ideia:'Ideia'};
function fresh(){return{therapy:{day:'',topics:[]},journal:[],reset:{weeks:{},rows:['Estudos','Trabalho','Projetos','Pessoal','Saúde']},mural:[],rem:[],wishes:[],cycle:{periods:[],log:{}},msgs:[],areas:DEFAULT_AREAS.map(a=>Object.assign({},a)),u:0,items:[],projects:[],routines:[],rlog:{},days:{},meds:[],symptoms:[],share:{person:'Meu namorado',mood:true,paused:false,history:[]},iris:{ag:true,ta:true,no:true,di:false,fi:false},habits:[],hlog:{},fin:{tx:[],bills:[]},home:{shop:[],maint:[]},memories:[],horizons:[],retro:{},pad:{groups:[],pages:[]},vault:null,profile:{name:'Natália',nick:'',birth:'',phone:'',email:'',city:'',work:'',allergies:'',blood:'',plan:'',hnotes:''},contacts:[],fun:[],prefs:{support:true,greet:false}}}
let data=fresh();
try{const r=localStorage.getItem(LS);if(r)data=Object.assign(fresh(),JSON.parse(r))}catch(e){}
const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const z=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const pd=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const today=iso(new Date());
const fmt=k=>pd(k).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
const fmtS=k=>pd(k).toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const area=id=>AREAS.find(a=>a.id===id);
const D=k=>data.days[k]||(data.days[k]={mood:null,energy:null,disp:null,taken:{},sym:{},text:''});
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}

/* ====== persistência: conta (privada) + cópia local ====== */
let docRef=null,status='local',saveT=null,saving=false,dirty=false;
function persist(){data.u=Date.now();try{localStorage.setItem(LS,JSON.stringify(data))}catch(e){}dirty=true;clearTimeout(saveT);saveT=setTimeout(flush,700)}
async function flush(){if(!docRef||saving||!dirty)return;saving=true;dirty=false;try{await docRef.set({json:JSON.stringify(data),u:data.u});status='conta'}catch(e){status='local';dirty=true}saving=false;if(dirty)saveT=setTimeout(flush,1500)}
async function connect(){
  try{
    if(!window.claude||!claude.use)return;
    const [user,db]=await Promise.all([claude.use('user'),claude.use('db')]);
    if(!user||!db)return;
    const id=await user.id();if(!id)return;
    docRef=db.collection('data/users/'+id).doc('app');
    const snap=await docRef.get();
    if(snap.exists){const r=snap.data();if(r&&r.json&&(r.u||0)>(data.u||0)){try{data=Object.assign(fresh(),JSON.parse(r.json));try{localStorage.setItem(LS,JSON.stringify(data))}catch(e){}}catch(e){}}}
    status='conta';dirty=true;await flush();render();
  }catch(e){status='local'}
}
/* ====== estado de tela ====== */
const ui={fm:today.slice(0,7),rm:today.slice(0,7),tab:'inicio',sub:null,month:new Date(new Date().getFullYear(),new Date().getMonth(),1),sel:today,tfilter:'todas',nsearch:'',nkind:'todas',edit:false,irisMsgs:[],irisPending:null,irisBusy:false,dictating:null};
let sheet=null;
function go(tab,sub){ui.ed=null;if(!(tab==='espacos'&&!sub))ui.spEdit=false;ui.tab=tab;ui.sub=sub||null;sheet=null;render();window.scrollTo(0,0)}

/* ====== util de itens ====== */
const items=()=>data.items;
function dotsFor(k){const s=new Set();items().forEach(i=>{if(i.type==='compromisso'&&i.date===k)s.add(i.area||'x');if(i.type==='tarefa'&&!i.done&&i.due===k)s.add(i.area||'x')});return [...s].map(a=>(area(a)||{c:'#655C69'}).c)}
function dayList(k){const ev=items().filter(i=>i.type==='compromisso'&&i.date===k).sort((a,b)=>(a.time||'').localeCompare(b.time||''));const ta=items().filter(i=>i.type==='tarefa'&&!i.done&&i.due===k);return {ev,ta}}
function itemRow(i,extra){const a=area(i.area);return `<div class="row" data-a="edit" data-id="${i.id}" role="button" tabindex="0"><span class="dot" style="background:${a?a.c:'#B5A897'}"></span><div class="grow"><div class="name">${esc(i.title)}</div><div class="small">${esc(TYPES[i.type])}${i.time?' · '+esc(i.time):''}${i.where?' · 📍 '+esc(i.where):''}${i.with?' · com '+esc(i.with):''}${i.date&&i.type==='compromisso'?' · '+esc(fmtS(i.date)):''}${i.due?' · prazo '+esc(fmtS(i.due)):''}${a?' · '+esc(a.n):''}</div></div>${extra||''}</div>`}
const chk=i=>`<button class="chip" data-a="done" data-id="${i.id}" aria-pressed="${!!i.done}" aria-label="Concluir">${i.done?'Feita':'Fazer'}</button>`;

/* ====== telas ====== */
function vInicio(){
  if(ui.sub==='mensagens')return vMensagens();
  const dd=D(today);const {ev,ta}=dayList(today);
  const imp=items().filter(i=>i.type==='tarefa'&&i.important&&!i.done).slice(0,5);
  const inbox=items().filter(i=>i.inbox).length;
  return `<div class="hero"><div class="d">${esc(fmt(today))}</div><div style="display:flex;align-items:center;gap:10px">${avatar(44)}<h1 style="flex:1">${greetWord()}, ${esc((data.prefs.greet&&data.profile.nick)||myName())}</h1><button data-a="nav" data-t="espacos" data-s="busca" aria-label="Buscar" style="min-width:44px;min-height:44px;border-radius:50%;border:1px solid #E6D9E8;background:transparent;color:#F1EAE0;font-size:18px">🔍</button><button data-a="nav" data-t="perfil" data-s="" aria-label="Perfil e configurações" style="min-width:44px;min-height:44px;border-radius:50%;border:1px solid #E6D9E8;background:transparent;color:#F1EAE0;font-size:20px">⚙</button></div></div>
  <div class="pad">
  ${msgCard()}
  ${remBox()}${therapyCard()}${data.prefs.weekly?`<button class="ghost" data-a="nav" data-t="espacos" data-s="revisao" style="width:100%">Ver a revisão da minha semana</button>`:''}
  <section><h2>O que tenho para hoje</h2><div class="card">${ev.concat(ta).map(i=>itemRow(i,i.type==='tarefa'?chk(i):'')).join('')||'<div class="row"><div class="small">Nada marcado para hoje.</div></div>'}</div></section>
  <section><h2>Não posso esquecer</h2><div class="card">${imp.map(i=>itemRow(i,chk(i))).join('')||'<div class="row"><div class="small">Marque tarefas como importantes e elas aparecem aqui.</div></div>'}</div></section>
  <section><h2>Registrar</h2><div style="display:flex;gap:8px"><input type="text" id="quick" placeholder="Escreva e toque em Enter" aria-label="Registrar rápido">${micBtn('quick')}</div>
  <button class="link" data-a="nav" data-t="espacos" data-s="caixa">Caixa de entrada · ${inbox} ${inbox===1?'item':'itens'} para classificar</button><button class="orange" data-a="nav" data-t="espacos" data-s="caderno" style="width:100%;margin-top:6px">Abrir caderno livre</button></section>
  <section>${data.prefs.moodChips?`<h2>Como estou</h2><div class="chips">${MOODS.map((m,i)=>`<button class="chip" data-a="quickmood" data-i="${i}" aria-pressed="${dd.mood===i}">${m}</button>`).join('')}</div>`:''}<button class="link" data-a="nav" data-t="espacos" data-s="diario">Registrar como estou, quando quiser →</button></section>
  </div>`;
}
function vAgenda(){
  const y=ui.month.getFullYear(),m=ui.month.getMonth();const first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
  let cells='';for(let i=0;i<first;i++)cells+='<span></span>';
  for(let d=1;d<=n;d++){const k=y+'-'+z(m+1)+'-'+z(d);cells+=`<button data-a="selday" data-k="${k}" class="${k===ui.sel?'sel':''} ${k===today?'td':''}" aria-label="${esc(fmt(k))}">${d}<span class="dots">${dotsFor(k).map(c=>`<i style="background:${k===ui.sel?'#F1EAE0':c}"></i>`).join('')}</span></button>`}
  const {ev,ta}=dayList(ui.sel);
  return `<div class="pad"><div><div class="sub" style="color:var(--vin);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:12px">Agenda</div><h1>${esc(ui.month.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}))}</h1></div>
  <div style="display:flex;gap:8px"><button class="ghost" data-a="mon" data-d="-1">← Mês anterior</button><button class="ghost" data-a="mon" data-d="1">Próximo →</button></div>
  <div class="card" style="padding:12px 8px"><div class="cal">${['D','S','T','Q','Q','S','S'].map(x=>`<span class="h">${x}</span>`).join('')}${cells}</div></div>
  <div class="chips" style="gap:6px 14px">${AREAS.map(a=>`<span class="small" style="display:inline-flex;align-items:center;gap:6px"><span class="dot" style="background:${a.c}"></span>${esc(a.n)}</span>`).join('')}</div>
  <section><h2>${esc(fmt(ui.sel))}</h2><div class="card">${ev.concat(ta).map(i=>itemRow(i,i.type==='tarefa'?chk(i):'')).join('')||'<div class="row"><div class="small">Nada neste dia.</div></div>'}</div>
  <div style="margin-top:10px"><button class="orange" data-a="newev">+ Compromisso neste dia</button></div></section></div>`;
}
function back(t){return `<button class="back" data-a="nav" data-t="espacos" data-s="">← Espaços</button>`}
function vEspacos(){
  if(ui.sub==='caixa')return vCaixa();if(ui.sub==='tarefas')return vTarefas();if(ui.sub==='notas')return vNotas();

function spActions(a,b,id){
  const pf=data.prefs;if(!pf.fav)pf.fav=[];if(!pf.hide)pf.hide=[];
  if(a==='spedit'){ui.spEdit=!ui.spEdit;render();return true}
  if(a==='spfav'){if(pf.fav.includes(id))pf.fav=pf.fav.filter(x=>x!==id);else{if(pf.fav.length>=5){toast('Máximo de 5 favoritos');return true}pf.fav.push(id);pf.hide=pf.hide.filter(x=>x!==id)}persist();render();return true}
  if(a==='sphide'){if(pf.hide.includes(id))pf.hide=pf.hide.filter(x=>x!==id);else{pf.hide.push(id);pf.fav=pf.fav.filter(x=>x!==id)}persist();render();return true}
  return false;
}

const monthLabel=ym=>{const [y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})};
const shiftYM=(ym,d)=>{const [y,m]=ym.split('-').map(Number);const x=new Date(y,m-1+d,1);return x.getFullYear()+'-'+z(x.getMonth()+1)};
function mnav(act,ym){return `<div style="display:flex;gap:8px;align-items:center"><button class="ghost" data-a="${act}" data-d="-1" aria-label="Mês anterior">←</button><div class="name grow" style="text-align:center;text-transform:capitalize">${esc(monthLabel(ym))}</div><button class="ghost" data-a="${act}" data-d="1" aria-label="Próximo mês">→</button></div>`}
const addDays=(k,n)=>{const d=pd(k);d.setDate(d.getDate()+n);return iso(d)};
/* Hábitos */
const hdue=(h,k)=>{const w=pd(k).getDay();return h.freq==='uteis'?(w>=1&&w<=5):h.freq==='fds'?(w===0||w===6):true};
const hdone=(h,k)=>!!(data.hlog[k]&&data.hlog[k][h.id]);
function streak(h){let s=0,k=today;if(hdue(h,k)&&!hdone(h,k))k=addDays(k,-1);for(let i=0;i<400;i++){if(!hdue(h,k)){k=addDays(k,-1);continue}if(hdone(h,k)){s++;k=addDays(k,-1)}else break}return s}
function vHabitos(){
  const FQ={todos:'Todos os dias',uteis:'Dias úteis',fds:'Fins de semana'};

  ${data.habits.map(h=>{if(ui.ed&&ui.ed.k==='habit'&&ui.ed.id===h.id)return habitEdit(h);const s=streak(h);const due=hdue(h,today);const tot=last7.filter(k=>hdue(h,k)).length,dn=last7.filter(k=>hdue(h,k)&&hdone(h,k)).length;

  <div class="card" style="padding:14px;display:flex;flex-direction:column;gap:10px"><h2 style="margin:0">Novo hábito</h2><input type="text" id="h-name" placeholder="Ex.: beber água, caminhar 15 min" aria-label="Nome do hábito"><select id="h-freq" aria-label="Frequência"><option value="todos">Todos os dias</option><option value="uteis">Dias úteis</option><option value="fds">Fins de semana</option></select><button class="orange" data-a="addhabit">Adicionar hábito</button></div></div>`;
}

/* ====== cofre de senhas (criptografado) ====== */
let vault=null,vaultTimer=null;ui.reveal={};ui.vedit=null;
const _enc=new TextEncoder(),_dec=new TextDecoder();
const b64=u=>{let s='';new Uint8Array(u).forEach(x=>s+=String.fromCharCode(x));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function vkey(pw,salt){const km=await crypto.subtle.importKey('raw',_enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function vsave(){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},vault.key,_enc.encode(JSON.stringify(vault.list)));data.vault={v:1,salt:b64(vault.salt),iv:b64(iv),ct:b64(ct)};persist()}
function vlock(msg){vault=null;ui.reveal={};ui.vedit=null;clearTimeout(vaultTimer);if(ui.tab==='espacos'&&ui.sub==='cofre'){render();if(msg)toast(msg)}}
function vtouch(){clearTimeout(vaultTimer);if(vault)vaultTimer=setTimeout(()=>vlock('Cofre trancado por inatividade'),120000)}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&vault)vlock()});
function vCofre(){
  const note='<div class="note">Criptografado com a sua senha mestra antes de ser salvo. Para senhas de banco e do e-mail principal, prefira o app Senhas do iPhone.</div>';
  if(!data.vault)return `<div class="pad">${back()}<h1>Cofre de senhas</h1>${note}<div class="warn"><b>Atenção:</b> se você esquecer a senha mestra, não há como recuperar o cofre. Nem eu consigo abrir.</div>
  <label class="f">Crie uma senha mestra (mínimo 8 caracteres)<input type="password" id="v-pw1" autocomplete="new-password"></label><label class="f">Repita a senha mestra<input type="password" id="v-pw2" autocomplete="new-password"></label><button class="primary" data-a="vcreate">Criar cofre</button></div>`;
  if(!vault)return `<div class="pad">${back()}<h1>Cofre de senhas</h1>${note}<label class="f">Senha mestra<input type="password" id="v-pw" autocomplete="off"></label><button class="primary" data-a="vunlock">Destrancar</button><button class="link" data-a="vreset" style="align-self:flex-start">Esqueci a senha mestra (apagar cofre)</button></div>`;
  const ed=ui.vedit?vault.list.find(x=>x.id===ui.vedit):null,e=ed||{};
  return `<div class="pad">${back()}<div style="display:flex;align-items:center"><h1 style="flex:1">Cofre de senhas</h1><button class="ghost" data-a="vlock">Trancar</button></div><div class="small">Tranca sozinho depois de 2 minutos parado.</div>
  <div class="card">${vault.list.map(x=>`<div class="row" style="align-items:flex-start"><div class="grow"><div class="name">${esc(x.site)}</div>${x.user?`<div class="small">${esc(x.user)}</div>`:''}<div style="font-family:ui-monospace,Menlo,monospace;font-size:15px;margin-top:4px;overflow-wrap:anywhere">${ui.reveal[x.id]?esc(x.pass):'••••••••••'}</div>${x.note?`<div class="small">${esc(x.note)}</div>`:''}<div style="display:flex;gap:4px;flex-wrap:wrap"><button class="link" data-a="vshow" data-id="${x.id}">${ui.reveal[x.id]?'Ocultar':'Mostrar'}</button><button class="link" data-a="vcopy" data-id="${x.id}">Copiar senha</button><button class="link" data-a="vedit" data-id="${x.id}">Editar</button><button class="link" data-a="vdel" data-id="${x.id}">Remover</button></div></div></div>`).join('')||'<div class="row"><div class="small">Cofre vazio.</div></div>'}</div>
  <div class="card" style="padding:14px;display:flex;flex-direction:column;gap:8px"><h2 style="margin:0">${ed?'Editar':'Nova senha'}</h2><input type="text" id="v-site" placeholder="Site ou serviço" value="${esc(e.site||'')}" aria-label="Site ou serviço"><input type="text" id="v-user" placeholder="Usuário ou e-mail" value="${esc(e.user||'')}" aria-label="Usuário" autocomplete="off"><div style="display:flex;gap:8px"><input type="text" id="v-pass" placeholder="Senha" value="${esc(e.pass||'')}" aria-label="Senha" autocomplete="off"><button class="ghost" data-a="vgen">Gerar</button></div><input type="text" id="v-note" placeholder="Observação (opcional)" value="${esc(e.note||'')}" aria-label="Observação"><div style="display:flex;gap:8px"><button class="orange" style="flex:1" data-a="vadd">${ed?'Salvar alterações':'Guardar senha'}</button>${ed?'<button class="ghost" data-a="vcancel">Cancelar</button>':''}</div></div></div>`;
}
function vaultActions(a,b,id){
  const q=i=>{const e=document.getElementById(i);return e?e.value:''};
  if(!a.startsWith('v')||!['vcreate','vunlock','vreset','vlock','vshow','vcopy','vedit','vdel','vgen','vadd','vcancel'].includes(a))return false;
  (async()=>{
    try{
      if(a==='vcreate'){const p1=q('v-pw1'),p2=q('v-pw2');if(p1.length<8){toast('Use pelo menos 8 caracteres');return}if(p1!==p2){toast('As senhas não são iguais');return}
        const salt=crypto.getRandomValues(new Uint8Array(16));vault={salt,key:await vkey(p1,salt),list:[]};await vsave();vtouch();render();toast('Cofre criado')}
      else if(a==='vunlock'){const pw=q('v-pw');const d=data.vault;const salt=unb64(d.salt);const key=await vkey(pw,salt);
        try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(d.iv)},key,unb64(d.ct));vault={salt,key,list:JSON.parse(_dec.decode(pt))};vtouch();render()}catch(e){toast('Senha mestra incorreta')}}
      else if(a==='vreset'){if(confirm('Apagar o cofre e todas as senhas guardadas nele? Não dá para desfazer.')){data.vault=null;vault=null;persist();render();toast('Cofre apagado')}}
      else if(a==='vlock'){vlock('Cofre trancado')}
      else if(!vault){return}
      else if(a==='vshow'){ui.reveal[id]=!ui.reveal[id];vtouch();render()}
      else if(a==='vcopy'){const x=vault.list.find(y=>y.id===id);try{await navigator.clipboard.writeText(x.pass);toast('Senha copiada')}catch(e){toast('Não consegui copiar')}vtouch()}
      else if(a==='vedit'){ui.vedit=id;vtouch();render();const s=document.getElementById('v-site');s&&s.scrollIntoView({block:'center'})}
      else if(a==='vcancel'){ui.vedit=null;render()}
      else if(a==='vdel'){if(confirm('Remover esta senha?')){vault.list=vault.list.filter(x=>x.id!==id);await vsave();vtouch();render()}}
      else if(a==='vgen'){const cs='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%&*?';const r=crypto.getRandomValues(new Uint32Array(18));document.getElementById('v-pass').value=[...r].map(n=>cs[n%cs.length]).join('');vtouch()}
      else if(a==='vadd'){const site=q('v-site').trim();if(!site||!q('v-pass')){toast('Preencha o site e a senha');return}const v={site,user:q('v-user').trim(),pass:q('v-pass'),note:q('v-note').trim()};
        if(ui.vedit){Object.assign(vault.list.find(x=>x.id===ui.vedit),v);ui.vedit=null}else vault.list.push(Object.assign({id:uid()},v));await vsave();vtouch();render();toast('Salvo no cofre')}
    }catch(e){toast('Algo deu errado no cofre')}
  })();
  return true;
}

/* ====== ciclo menstrual ====== */
const FLOW=['Sem fluxo','Leve','Médio','Intenso'];
const CSYM=['Cólica','Dor de cabeça','Inchaço','Cansaço','Sensibilidade nos seios','Irritabilidade','Tristeza','Ansiedade','Vontade de comer','Sono ruim'];
function cyc(){if(!data.cycle)data.cycle={periods:[],log:{}};return data.cycle}
function cycStarts(){return cyc().periods.map(x=>x.start).sort()}
function cycAvg(){const st=cycStarts();const d=[];for(let i=1;i<st.length;i++){const n=Math.round((pd(st[i])-pd(st[i-1]))/864e5);if(n>=15&&n<=60)d.push(n)}const l=d.slice(-6);return l.length?Math.round(l.reduce((a,b)=>a+b,0)/l.length):0}
function vCiclo(){
  const C=cyc(),st=cycStarts(),last=st[st.length-1],avg=cycAvg();
  const day=last?Math.round((pd(today)-pd(last))/864e5)+1:0;
  const next=last?addDays(last,avg||28):'';
  const lg=C.log[today]||{flow:0,sym:[],note:''};
  const open=C.periods.find(x=>x.start===last&&!x.end);
  return `<div class="pad">${back()}<h1>Ciclo</h1><div class="sub">Fica só no seu app. Não entra na Íris nem em envios, a menos que você ligue.</div>
  <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:6px">${last?`<div class="name">Dia ${day} do ciclo</div><div class="small">Última menstruação começou em ${esc(fmtS(last))}${open?' · em andamento':''}</div><div class="small">${avg?'Ciclo médio: '+avg+' dias (de '+Math.max(0,st.length-1)+' ciclos registrados)':'Registre mais um início para calcular seu ciclo médio. Por enquanto uso 28 dias.'}</div><div class="name" style="margin-top:6px">Próxima prevista: ${esc(fmtS(next))}</div><div class="small">Estimativa simples. Pode variar e não serve como método contraceptivo nem diagnóstico.</div>`:'<div class="small">Nenhum registro ainda. Marque o primeiro dia da menstruação abaixo.</div>'}
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="orange" data-a="cstart">Começou hoje</button>${open?'<button class="ghost" data-a="cend">Terminou hoje</button>':''}</div></div>
  <div class="card" style="padding:14px;display:flex;flex-direction:column;gap:10px"><h2 style="margin:0">Hoje</h2><div class="small">Fluxo</div><div class="chips">${FLOW.map((f,i)=>`<button class="chip" data-a="cflow" data-i="${i}" aria-pressed="${lg.flow===i}">${f}</button>`).join('')}</div><div class="small">Sintomas</div><div class="chips">${CSYM.map((f,i)=>`<button class="chip" data-a="csym" data-i="${i}" aria-pressed="${lg.sym.includes(f)}">${f}</button>`).join('')}</div><textarea id="c-note" aria-label="Observação do dia" placeholder="Observação (opcional)" style="min-height:60px">${esc(lg.note||'')}</textarea></div>
  <div class="card"><div class="row"><div class="grow"><div class="name">Histórico</div></div></div>${C.periods.slice().sort((a,b)=>b.start.localeCompare(a.start)).map(x=>ui.ed&&ui.ed.k==='per'&&ui.ed.id===x.id?perEdit(x):`<div class="row"><div class="grow"><div class="name">${esc(fmtS(x.start))}${x.end?' até '+esc(fmtS(x.end)):''}</div><div class="small">${x.end?(Math.round((pd(x.end)-pd(x.start))/864e5)+1)+' dias de fluxo':'em andamento'}</div></div><button class="link" data-a="edstart" data-k="per" data-id="${x.id}">Editar</button><button class="link" data-a="cdel" data-id="${x.id}" aria-label="Remover registro">Remover</button></div>`).join('')||'<div class="row"><div class="small">Sem registros.</div></div>'}</div>
  <div class="card" style="padding:14px;display:flex;flex-direction:column;gap:10px"><h2 style="margin:0">Registrar data passada</h2><label class="f">Início<input type="date" id="c-s"></label><label class="f">Fim (opcional)<input type="date" id="c-e"></label><button class="ghost" data-a="cadd">Adicionar</button></div></div>`;
}
function cycActions(a,b,id){
  const C=cyc();
  if(a==='cstart'){if(!C.periods.some(x=>x.start===today))C.periods.push({id:uid(),start:today,end:''});persist();render();return true}
  if(a==='cend'){const o=C.periods.find(x=>!x.end);if(o)o.end=today;persist();render();return true}
  if(a==='cdel'){C.periods=C.periods.filter(x=>x.id!==id);persist();render();return true}
  if(a==='cadd'){const s0=document.getElementById('c-s').value,e0=document.getElementById('c-e').value;if(!s0){toast('Escolha a data de início');return true}if(e0&&e0<s0){toast('O fim vem depois do início');return true}C.periods.push({id:uid(),start:s0,end:e0||''});persist();render();return true}
  if(a==='cflow'||a==='csym'){const nt=document.getElementById('c-note');const l=C.log[today]=C.log[today]||{flow:0,sym:[],note:''};if(nt)l.note=nt.value;const i=+b.dataset.i;if(a==='cflow')l.flow=i;else{const n=CSYM[i];l.sym=l.sym.includes(n)?l.sym.filter(x=>x!==n):l.sym.concat(n)}persist();render();return true}
  return false;
}

  ${done.length?`<div class="card"><div class="row"><div class="grow"><div class="name">Realizados</div></div></div>${done.map(w=>`<div class="row"><div class="grow"><div class="name">${esc(w.name)}</div><div class="small">${w.value?brl(w.value):''}</div></div><button class="link" data-a="wundo" data-id="${w.id}">Reabrir</button></div>`).join('')}</div>`:''}</div>`;
}
function wishActions(a,b,id){
  if(!data.wishes)data.wishes=[];const W=data.wishes;

function remDue(r){return !r.done&&(r.date<today||(r.date===today))}
function remBox(){const L=(data.rem||[]).filter(remDue).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));if(!L.length)return '';
  return `<section><h2>Lembretes</h2><div class="card">${L.map(r=>`<div class="row"><div class="grow"><div class="name">${esc(r.t)}</div><div class="small">${r.date<today?'Atrasado · '+esc(fmtS(r.date)):'Hoje'}${r.time?' · '+esc(r.time):''}</div></div><button class="chip" data-a="remdone" data-id="${r.id}" aria-pressed="false">Feito</button></div>`).join('')}</div></section>`}
function vLembretes(){
  const R=(data.rem||[]);const open=R.filter(r=>!r.done).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));const dn=R.filter(r=>r.done);
  return `<div class="pad">${back()}<h1>Lembretes</h1><div class="sub">O app mostra seus lembretes no Início quando você o abre. Ele não consegue avisar com o app fechado. Para ser avisada pelo iPhone, leve os lembretes para o Calendário.</div>
  <div class="card">${open.map(r=>ui.ed&&ui.ed.k==='rem'&&ui.ed.id===r.id?remEdit(r):`<div class="row"><div class="grow"><div class="name">${esc(r.t)}</div><div class="small">${esc(fmtS(r.date))}${r.time?' · '+esc(r.time):' · dia todo'}${r.date<today?' · atrasado':''}</div></div><button class="chip" data-a="remdone" data-id="${r.id}" aria-pressed="false">Feito</button><button class="link" data-a="edstart" data-k="rem" data-id="${r.id}">Editar</button><button class="link" data-a="remdel" data-id="${r.id}">Remover</button></div>`).join('')||'<div class="row"><div class="small">Nenhum lembrete pendente.</div></div>'}</div>
  <div class="card" style="padding:14px;display:flex;flex-direction:column;gap:10px"><h2 style="margin:0">Novo lembrete</h2><input type="text" id="r-t" placeholder="Ex.: tomar o remédio, ligar para a mãe" aria-label="Lembrete"><div style="display:flex;gap:8px"><label class="f" style="flex:1">Data<input type="date" id="r-d" value="${today}"></label><label class="f" style="flex:1">Hora (opcional)<input type="time" id="r-h"></label></div><button class="orange" data-a="remadd">Adicionar lembrete</button></div>
  ${open.length?`<button class="ghost" data-a="remics" style="width:100%">Levar para o Calendário do iPhone (.ics)</button><div class="note">Gera um arquivo. Ao abri-lo no iPhone, você escolhe adicionar ao Calendário, e cada lembrete avisa na hora marcada.</div>`:''}
  ${dn.length?`<div class="card"><div class="row"><div class="grow"><div class="name">Feitos</div></div><button class="link" data-a="remclear">Limpar</button></div>${dn.slice(-10).map(r=>`<div class="row"><div class="grow small">${esc(r.t)}</div></div>`).join('')}</div>`:''}</div>`;
}
function icsEsc(t){return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function remICS(){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Meu app//PT','CALSCALE:GREGORIAN'];
  (data.rem||[]).filter(r=>!r.done).forEach(r=>{const d=r.date.replace(/-/g,'');const hh=r.time?r.time.replace(':','')+'00':'';
    L.push('BEGIN:VEVENT','UID:'+r.id+'@meuapp','DTSTAMP:'+today.replace(/-/g,'')+'T000000');
    if(hh){L.push('DTSTART:'+d+'T'+hh,'DTEND:'+d+'T'+hh)}else{L.push('DTSTART;VALUE=DATE:'+d)}
    L.push('SUMMARY:'+icsEsc(r.t),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(r.t),hh?'TRIGGER:PT0M':'TRIGGER:PT9H','END:VALARM','END:VEVENT')});
  L.push('END:VCALENDAR');const txt=L.join('\r\n');
  Promise.resolve(window.claude&&claude.use?claude.use('downloads'):null).then(d=>{if(!d){if(!blobDownload('lembretes-'+today+'.ics',txt,'text/calendar'))toast('Indisponível aqui');return}
    d.save({filename:'lembretes-'+today+'.ics',data:txt}).then(()=>toast('Arquivo salvo')).catch(e=>{if(!e||e.code!=='declined')toast('Não foi possível salvar')})}).catch(()=>{if(!blobDownload('lembretes-'+today+'.ics',txt,'text/calendar'))toast('Indisponível aqui')});
}
function remActions(a,b,id){
  if(!data.rem)data.rem=[];const R=data.rem;
  if(a==='remadd'){const t=fv('r-t').trim(),d=fv('r-d');if(!t||!d){toast('Preencha texto e data');return true}R.push({id:uid(),t,date:d,time:fv('r-h'),done:false});persist();render();return true}
  if(a==='remdone'){const r=R.find(x=>x.id===id);if(r)r.done=true;persist();render();return true}
  if(a==='remdel'){data.rem=R.filter(x=>x.id!==id);persist();render();return true}
  if(a==='remclear'){data.rem=R.filter(x=>!x.done);persist();render();return true}
  if(a==='remics'){remICS();return true}
  return false;
}
/* revisão semanal */
function vRevisao(){
  const pf=data.prefs;if(!pf.wk)pf.wk={fez:true,humor:true,meds:true,gastos:true};const wk=pf.wk;
  const days=[6,5,4,3,2,1,0].map(n=>addDays(today,-n));const a0=days[0];
  const L=[];
  if(wk.fez){const t=items().filter(i=>i.type==='tarefa'&&i.done&&i.doneAt&&iso(new Date(i.doneAt))>=a0).length;const c=items().filter(i=>i.type==='compromisso'&&i.date>=a0&&i.date<=today).length;let hb=0;data.habits.forEach(h=>days.forEach(k=>{if(hdue(h,k)&&hdone(h,k))hb++}));
    const rw=(data.reset&&data.reset.weeks||{})[mondayOf(today)];const pt=rw&&rw.pt?rw.pt.filter(id=>items().find(x=>x.id===id)):[];const pd_=pt.filter(id=>items().find(x=>x.id===id).done).length;
    L.push(['O que você fez',`${t} ${t===1?'tarefa concluída':'tarefas concluídas'} · ${c} ${c===1?'compromisso':'compromissos'} · ${hb} ${hb===1?'hábito feito':'hábitos feitos'}`+(pt.length?` · ${pd_} de ${pt.length} prioridades do reset`:'')])}
  if(wk.humor){const ms=days.map(k=>data.days[k]&&data.days[k].mood).filter(m=>m!=null);
    L.push(['Humor',ms.length?`${ms.length} ${ms.length===1?'dia registrado':'dias registrados'}: `+MOODS.map((m,i)=>[m,ms.filter(x=>x===i).length]).filter(x=>x[1]).map(x=>x[1]+'× '+x[0].toLowerCase()).join(', '):'Nenhum dia registrado. Tudo bem.'])}
  if(wk.meds){if(!data.meds.length)L.push(['Medicação','Nenhuma medicação cadastrada.']);else{let tk=0,po=0;days.forEach(k=>{const d=data.days[k];if(d&&(d.mood!=null||Object.keys(d.taken||{}).length)){po+=data.meds.length;tk+=data.meds.filter(m=>d.taken&&d.taken[m.id]).length}});L.push(['Medicação',po?`${tk} de ${po} marcadas nos dias em que você registrou.`:'Sem registros nesta semana.'])}}
  if(wk.gastos){const ds=data.fin.tx.filter(t=>t.type==='despesa'&&t.date>=a0&&t.date<=today);const tot=ds.reduce((x,t)=>x+t.value,0);const by={};ds.forEach(t=>by[t.cat]=(by[t.cat]||0)+t.value);const top=Object.entries(by).sort((x,y)=>y[1]-x[1]).slice(0,3).map(x=>x[0]+' '+brl(x[1])).join(' · ');
    L.push(['Gastos',ds.length?`${brl(tot)} em ${ds.length} ${ds.length===1?'saída':'saídas'}. ${top}`:'Nenhuma saída registrada.'])}
  return `<div class="pad">${back()}<h1>Revisão semanal</h1><div class="sub">${esc(fmtS(a0))} até ${esc(fmtS(today))}. Só um retrato da semana, sem notas e sem cobrança.</div>
  <div class="card">${L.map(x=>`<div class="row" style="align-items:flex-start"><div class="grow"><div class="name">${x[0]}</div><div class="small">${esc(x[1])}</div></div></div>`).join('')||'<div class="row"><div class="small">Todas as partes estão desligadas.</div></div>'}</div>
  <div class="card"><div class="row"><div class="grow"><div class="name">O que mostrar</div></div></div>${[['fez','O que fiz'],['humor','Humor'],['meds','Medicação'],['gastos','Gastos']].map(o=>`<label class="row" style="cursor:pointer;min-height:44px"><span class="grow name">${o[1]}</span><input type="checkbox" data-a="wkset" data-k="${o[0]}" ${wk[o[0]]?'checked':''} style="width:24px;height:24px" aria-label="Mostrar ${o[1]}"></label>`).join('')}</div>
  <div class="card">${sw('p:weekly',pf.weekly,'Lembrar de ver a revisão no Início','Aparece como um botão discreto. Desligado por padrão')}</div></div>`;
}

function muralActions(a,b,id){
  if(!data.mural)data.mural=[];const M=data.mural;
  if(a==='pocol'){const nt=document.getElementById('pn-t')||document.getElementById('po-t');const keep=nt?nt.value:'';ui.pcol=+b.dataset.i;if(ui.ed&&ui.ed.k==='post'){const n=M.find(x=>x.id===ui.ed.id);if(n){n.c=PCOL[ui.pcol][0];n.t=keep}}ui.pdraft=keep;render();const t2=document.getElementById('pn-t');if(t2&&!(ui.ed&&ui.ed.k==='post'))t2.value=keep;return true}
  if(a==='poadd'){const t=fv('pn-t').trim();if(!t){toast('Escreva o post-it');return true}M.push({id:uid(),t,c:PCOL[ui.pcol||0][0],pin:false,ts:Date.now()});persist();render();return true}

  return false;
}

const RCHK=['Revisar a semana que passou','Atualizar compromissos e prazos','Definir 3 prioridades da semana','Organizar estudos, trabalho e projetos','Planejar refeições e autocuidado','Preparar o ambiente de estudo/trabalho'];

function mondayOf(k){const d=pd(k);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d)}
function rsData(){if(!data.reset)data.reset={weeks:{},rows:['Estudos','Trabalho','Projetos','Pessoal','Saúde']};return data.reset}
function rsWeek(){const R=rsData();const k=ui.rsw||mondayOf(today);return R.weeks[k]||(R.weeks[k]={chk:[],pri:['','',''],meta:[{t:'',d:false},{t:'',d:false},{t:'',d:false}],foco:['','','','','','',''],auto:[],trk:{},notes:''})}
function rsSet(path,v){const R=rsData(),W=rsWeek(),p=path.split('.');
  if(p[0]==='chk'||p[0]==='auto'){W[p[0]][+p[1]]=!!v}
  else if(p[0]==='pri'||p[0]==='foco'){W[p[0]][+p[1]]=v}
  else if(p[0]==='meta'){W.meta[+p[1]][p[2]]=p[2]==='d'?!!v:v}
  else if(p[0]==='trk'){const a=W.trk[p[1]]=W.trk[p[1]]||[];a[+p[2]]=!!v}
  else if(p[0]==='row'){R.rows[+p[1]]=v||R.rows[+p[1]]}
  else if(p[0]==='notes'){W.notes=v}
  persist()}
function rsBox(path,on,label){return `<label class="row" style="min-height:44px;cursor:pointer;gap:12px"><input type="checkbox" data-rs="${path}" ${on?'checked':''} style="width:24px;height:24px;flex:none" aria-label="${esc(label)}"><span class="grow name" style="font-weight:500">${esc(label)}</span></label>`}

  <div class="card">${H('Metas da semana')}${W.meta.map((m,i)=>`<div class="row" style="gap:10px"><input type="checkbox" data-rs="meta.${i}.d" ${m.d?'checked':''} style="width:24px;height:24px;flex:none" aria-label="Meta ${i+1} cumprida">${line('meta.'+i+'.t',m.t,'Meta '+(i+1))}</div>`).join('')}</div>
  <div class="card">${H('Minha semana em foco')}${RDAYS.map((d,i)=>`<div class="row" style="gap:10px"><span class="name" style="width:44px;flex:none">${d}<span class="small" style="display:block">${esc(addDays(k,i).slice(8))}</span></span><div class="grow">${line('foco.'+i,W.foco[i],'Principal foco do dia',d+': foco do dia')}${(()=>{const ev=dayList(addDays(k,i)).ev;return ev.length?`<div class="small" style="margin-top:4px">${ev.length} ${ev.length===1?'compromisso':'compromissos'}: ${ev.slice(0,3).map(x=>esc((x.time?x.time+' ':'')+x.title)).join(' · ')}</div>`:''})()}</div></div>`).join('')}</div>

/* ====== busca geral ====== */
const nrm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function searchAll(q){
  const n=nrm(q).trim();if(n.length<2)return [];const R=[];
  const hit=(...f)=>f.some(x=>nrm(x).includes(n));
  const go_=(lbl,t,sub,extra,sp)=>R.push({lbl,t,sub:sub||'',sp,extra});
  items().forEach(i=>{if(hit(i.title,i.text,i.where,i.with))R.push({lbl:TYPES[i.type],t:i.title,sub:[i.date&&fmtS(i.date),i.due&&'prazo '+fmtS(i.due)].filter(Boolean).join(' · '),edit:i.id})});
  (data.mural||[]).forEach(m=>{if(hit(m.t))go_('Mural',m.t.slice(0,80),'','', 'mural')});
  (data.memories||[]).forEach(m=>{if(hit(m.title,m.text))go_('Memória',m.title,fmt(m.date),'','memorias')});
  (data.wishes||[]).forEach(w=>{if(hit(w.name,w.why))go_('Desejo',w.name,w.value?brl(w.value):'','','desejos')});
  (data.horizons||[]).forEach(h=>{if(hit(h.title,h.desc,h.why))go_('Meta',h.title,h.cat,'','horizontes')});
  ((data.pad&&data.pad.pages)||[]).forEach(g=>{if(hit(g.title,g.text))go_('Caderno',g.title||'Sem título','','','caderno')});
  (data.projects||[]).forEach(p=>{if(hit(p.name,p.title))go_('Projeto',p.name||p.title,'','','projetos')});
  (data.habits||[]).forEach(h=>{if(hit(h.name))go_('Hábito',h.name,'','','habitos')});
  (data.rem||[]).forEach(r=>{if(hit(r.t))go_('Lembrete',r.t,fmtS(r.date),'','lembretes')});
  (data.msgs||[]).forEach(m=>{if(hit(m.t))go_('Mensagem',m.t.slice(0,80),'','','mensagens')});
  ((data.fin&&data.fin.tx)||[]).forEach(t=>{if(hit(t.desc))go_(t.type==='despesa'?'Despesa':'Receita',t.desc,brl(t.value)+' · '+fmtS(t.date),'','financas')});
  ((data.home&&data.home.shop)||[]).forEach(m=>{if(hit(m.t))go_('Mercado',m.t,'','','casa')});
  return R.slice(0,40);
}
function searchHTML(q){
  if(nrm(q).trim().length<2)return '<div class="note">Digite pelo menos 2 letras. A busca olha tarefas, compromissos, anotações, mural, memórias, desejos, metas, caderno, hábitos, lembretes e finanças. Diário, Ciclo, Cofre e Perfil ficam de fora de propósito.</div>';
  const R=searchAll(q);if(!R.length)return '<div class="note">Nada encontrado.</div>';
  return `<div class="card">${R.map(x=>x.edit?`<div class="row" data-a="edit" data-id="${x.edit}" role="button" tabindex="0"><div class="grow"><div class="name">${esc(x.t)}</div><div class="small">${esc(x.lbl)}${x.sub?' · '+esc(x.sub):''}</div></div></div>`:`<button class="row" style="width:100%;background:none;border:0;border-bottom:1px solid #E8DFD1;text-align:left" data-a="nav" data-t="espacos" data-s="${x.sp}"><div class="grow"><div class="name">${esc(x.t)}</div><div class="small">${esc(x.lbl)}${x.sub?' · '+esc(x.sub):''}</div></div></button>`).join('')}</div>`;
}

const WD=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
function thData(){if(!data.therapy)data.therapy={day:'',topics:[]};return data.therapy}
function therapyCard(){const T=thData();if(T.day==='')return '';const wd=new Date().getDay();const today_=+T.day===wd,eve=(+T.day+6)%7===wd;if(!today_&&!eve)return '';const n=T.topics.filter(x=>!x.done).length;
  return `<section class="card" style="padding:16px;display:flex;flex-direction:column;gap:8px"><div class="name">${today_?'Hoje é dia de terapia':'Amanhã é dia de terapia'}</div><div class="small">${today_?'Sua semana já está pronta para você lembrar':'Dá para ir juntando o que você quer lembrar'}${n?' e há '+n+(n===1?' assunto':' assuntos')+' para levar':''}.</div><button class="orange" data-a="nav" data-t="espacos" data-s="terapia">${today_?'Ver minha semana':'Ver assuntos e semana'}</button></section>`}
function thWeek(){
  const T=thData();const out=[];
  [6,5,4,3,2,1,0].forEach(n=>{const k=addDays(today,-n);const dd=data.days[k];const parts=[];
    if(dd){if(dd.mood!=null)parts.push('Humor: '+MOODS[dd.mood].toLowerCase());
      if(dd.energy!=null&&typeof LV!=='undefined'&&LV[dd.energy])parts.push('Energia: '+LV[dd.energy].toLowerCase());
      const sy=data.symptoms.filter(x=>dd.sym&&dd.sym[x.id]>0).map(x=>x.name+' '+dd.sym[x.id]+'/5');if(sy.length)parts.push('Sintomas: '+sy.join(', '));
      if(data.meds.length&&dd.taken&&Object.keys(dd.taken).length)parts.push('Medicação: '+data.meds.filter(m=>dd.taken[m.id]).length+' de '+data.meds.length+' tomadas')}
    const tx=[];if(dd&&dd.text)tx.push(dd.text);(data.journal||[]).filter(j=>j.date===k).forEach(j=>tx.push(j.text));
    out.push({k,parts,tx})});
  return out;
}
function vTerapia(){
  const T=thData(),W=thWeek();
  return `<div class="pad">${back()}<h1>Para a terapia</h1><div class="sub">Sua semana reunida em um lugar, para você lembrar. Fica só no seu app.</div>

  <div style="display:flex;gap:8px;margin-top:8px"><input type="text" id="th-new" placeholder="Um assunto para levar" aria-label="Novo assunto">${micBtn('th-new')}<button class="orange" data-a="thadd">Adicionar</button></div>${T.topics.some(x=>x.done)?'<button class="link" data-a="thclear">Limpar os já falados</button>':''}</section>
  <section><h2>Minha semana</h2>${W.map(d=>`<div class="card" style="margin-bottom:8px"><div class="row" style="flex-direction:column;align-items:stretch;gap:6px"><div class="name">${esc(fmt(d.k))}${d.k===today?' · hoje':''}</div>${d.parts.map(x=>`<div class="small">${esc(x)}</div>`).join('')}${d.tx.map(x=>`<div style="font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere">${esc(x)}</div>`).join('')||(d.parts.length?'':'<div class="small">Sem registro.</div>')}</div></div>`).join('')}</section>
  <button class="ghost" data-a="thcopy" style="width:100%">Copiar resumo da semana</button>

}
function thText(){const T=thData();let t='Minha semana\n';thWeek().forEach(d=>{t+='\n'+fmt(d.k)+'\n';d.parts.forEach(x=>t+=x+'\n');d.tx.forEach(x=>t+=x+'\n');if(!d.parts.length&&!d.tx.length)t+='Sem registro\n'});const tp=T.topics.filter(x=>!x.done);if(tp.length){t+='\nQuero falar sobre\n'+tp.map(x=>'- '+x.t).join('\n')}return t}
function thActions(a,b,id){
  const T=thData();
  if(a==='thadd'){const t=fv('th-new').trim();if(!t){toast('Escreva o assunto');return true}T.topics.push({id:uid(),t,done:false});persist();render();return true}
  if(a==='thtoggle'){const x=T.topics.find(y=>y.id===id);if(x)x.done=b.checked!==undefined?b.checked:!x.done;persist();render();return true}
  if(a==='thdel'){T.topics=T.topics.filter(y=>y.id!==id);persist();render();return true}
  if(a==='thclear'){T.topics=T.topics.filter(y=>!y.done);persist();render();return true}
  if(a==='thcopy'){const txt=thText();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Resumo copiado')).catch(()=>toast('Não consegui copiar'));else toast('Não consegui copiar');return true}
  return false;
}

function saveForm(){
  const g=id=>{const e=document.getElementById(id);return e?e.value:''};
  const title=g('f-title').trim();if(!title){toast('Escreva um título');return}
  const t=sheet.type;const ar=g('f-area');
  let it=sheet.item;const isNew=!it;if(isNew){it={id:uid(),type:t,created:Date.now()};data.items.push(it)}
  it.title=title;it.text=g('f-text');it.area=ar;
  if(t==='compromisso'){it.date=g('f-date')||ui.sel;it.time=g('f-time');it.where=g('f-where').trim();it.with=g('f-with').trim();it.inbox=false}
  else{if(t==='tarefa'){it.due=g('f-due');it.important=document.getElementById('f-imp').checked;it.project=g('f-proj')}
    it.inbox=!ar}
  persist();sheet=null;render();toast('Salvo')
}
function blobDownload(name,txt,mime){try{const u=URL.createObjectURL(new Blob([txt],{type:mime||'text/plain'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500);toast('Arquivo gerado');return true}catch(e){return false}}
function exportData(){
  const txt=JSON.stringify(data);
  Promise.resolve(window.claude&&claude.use?claude.use('downloads'):null).then(d=>{if(!d){if(!blobDownload('meu-app-copia-'+today+'.json',txt,'application/json'))navigator.clipboard&&navigator.clipboard.writeText(txt).then(()=>toast('Dados copiados'));return}
    d.save({filename:'meu-app-copia-'+today+'.json',data:txt}).then(()=>toast('Cópia salva')).catch(e=>{if(!e||e.code!=='declined')toast('Não foi possível salvar')})}).catch(()=>toast('Indisponível aqui'));
}

  if(I.ta){out.push('TAREFAS ABERTAS: '+(items().filter(i=>i.type==='tarefa'&&!i.done).map(i=>`${i.title} [${i.area||'sem área'}]${i.due?' prazo '+i.due:''}${i.important?' IMPORTANTE':''}`).join('; ')||'nenhuma'))}
  if(I.no){out.push('ANOTAÇÕES: '+(items().filter(i=>i.type==='nota'||i.type==='ideia').slice(-30).map(i=>`${i.title}: ${(i.text||'').slice(0,120)}`).join(' | ')||'nenhuma'))}

- Não faça diagnóstico, não interprete saúde emocional nem dê conselho médico ou sobre medicação. Pode ouvir, validar e sugerir conversar com a psicóloga quando fizer sentido. Se ela falar em se machucar ou em não querer mais viver, fique perto, com calma, e lembre que ela pode ligar para o CVV, 188, a qualquer hora, ou SAMU 192 se for urgente.

${irisContext()||'(nenhum módulo liberado)'}

    const r=await sample(prompt,{cache:false});
    let o=null;const m=(r.text||'').match(/\{[\s\S]*\}/);if(m){try{o=JSON.parse(m[0])}catch(e){}}
    if(o&&o.reply!==undefined){ui.irisMsgs.push({r:'ia',t:String(o.reply)});const A=o.action;if(A&&A.kind==='diario'&&A.text){if(data.prefs.irisAuto){irisSaveDiary(A);ui.irisMsgs.push({r:'ia',t:'Guardei no Diário dos dias, em '+(A.date&&/^\d{4}-\d{2}-\d{2}$/.test(A.date)?fmtS(A.date):'hoje')+'.'})}else ui.irisPending=A}else if(A&&A.title&&['tarefa','compromisso','nota'].includes(A.kind))ui.irisPending=A}
    else ui.irisMsgs.push({r:'ia',t:(r.text||'Não consegui responder agora.').slice(0,900)});
  }catch(e){ui.irisMsgs.push({r:'ia',t:e&&e.code==='not_granted'?'Você ainda não me autorizou a conversar por aqui.':'Ops, me perdi aqui. Tenta de novo em instantes?'})}
  ui.irisBusy=false;render();
}

function irisDiaryCard(){const a=ui.irisPending;const d=/^\d{4}-\d{2}-\d{2}$/.test(a.date||'')?a.date:today;
  return `<div class="card" style="padding:14px;display:flex;flex-direction:column;gap:10px;align-self:stretch"><h2 style="margin:0">Guardar no diário de ${d===today?'hoje':esc(fmtS(d))}?</h2><textarea id="ir-dtext" aria-label="Texto para o diário" style="min-height:100px">${esc(a.text)}</textarea><div style="display:flex;gap:8px"><button class="orange" data-a="irisok">Guardar</button><button class="ghost" data-a="irisno">Agora não</button></div><div class="small">Você pode ajustar o texto antes. Fica no seu Diário dos dias, que é privado.</div></div>`}
function irisSaveDiary(a,txt){const d=/^\d{4}-\d{2}-\d{2}$/.test(a.date||'')?a.date:today;const t=String(txt!=null?txt:a.text||'').trim();if(!t)return;if(!data.journal)data.journal=[];const e={id:uid(),date:d,text:t,ts:Date.now()};data.journal.push(e);ui.irisUndo={id:e.id};persist()}
function irisOk(){
  const a=ui.irisPending;if(!a)return;
  if(a.kind==='diario'){const e=document.getElementById('ir-dtext');irisSaveDiary(a,e?e.value:a.text);ui.irisPending=null;ui.irisMsgs.push({r:'ia',t:'Guardado no Diário dos dias.'});render();return}
  const it={id:uid(),type:a.kind,title:a.title,text:'',area:AREAS.some(x=>x.id===a.area)?a.area:'',created:Date.now()};
  if(a.kind==='compromisso'){it.date=/^\d{4}-\d{2}-\d{2}$/.test(a.date||'')?a.date:today;it.time=a.time||'';it.inbox=false}else{if(a.kind==='tarefa')it.due=/^\d{4}-\d{2}-\d{2}$/.test(a.date||'')?a.date:'';it.inbox=!it.area}
  data.items.push(it);persist();ui.irisPending=null;ui.irisMsgs.push({r:'ia',t:'Feito! Já deixei lá pra você.'});render();
}

let dict=null;
async function startMic(id,btn){
  try{
    if(!dict)dict=await claude.use('dictation');if(!dict)return;
    const el=document.getElementById(id);if(!el)return;
    if(ui.dictating){await dict.stop();ui.dictating=null;btn.textContent='🎤';return}
    const base=el.value;let fin='';
    dict.onFinal(({text})=>{fin+=(fin?' ':'')+text;el.value=(base?base+' ':'')+fin});
    dict.onPartial(({text})=>{el.value=(base?base+' ':'')+fin+(fin?' ':'')+text});
    dict.onState(({state})=>{if(state==='idle'){ui.dictating=null;btn.textContent='🎤';el.dispatchEvent(new Event('input',{bubbles:true}))}});
    ui.dictating=id;btn.textContent='⏹';await dict.start();
  }catch(e){ui.dictating=null;btn.textContent='🎤'}
}

  if(a==='mon'){ui.month=new Date(ui.month.getFullYear(),ui.month.getMonth()+(+b.dataset.d),1);render();return}
  if(a==='tf'){ui.tfilter=b.dataset.f;render();return}
  if(a==='nk'){ui.nkind=b.dataset.k;render();return}

  if(a==='leve'){const L=(data.rlog[today]=data.rlog[today]||{});const g=(L[id]=L[id]||{done:{}});g.leve=!g.leve;persist();render();return}
  const dd=()=>D(today);
  if(a==='mood'){dd().mood=+b.dataset.i;persist();render();return}
  if(a==='energy'){dd().energy=+b.dataset.i;persist();render();return}
  if(a==='disp'){dd().disp=+b.dataset.i;persist();render();return}

  if(a==='irissend'){irisSend();return}
  if(a==='irisok'){irisOk();return}
